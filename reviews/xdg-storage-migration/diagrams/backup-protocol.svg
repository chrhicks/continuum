<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">R2 backup create, list, and restore paths</title><desc id="desc">Three protocol paths show inputs, remote objects, verification gates, and outputs. Cross-version restore is highlighted as a defect.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.bg{fill:#0f172a}.t{fill:#f8fafc;font:700 30px system-ui}.h{fill:#f8fafc;font:700 20px system-ui}.l{fill:#f8fafc;font:700 15px system-ui}.s{fill:#cbd5e1;font:13px system-ui}.lane{fill:#111827;stroke:#334155;stroke-width:2;rx:15}.step{fill:#1e3a8a;stroke:#60a5fa;stroke-width:2;rx:10}.gate{fill:#065f46;stroke:#34d399;stroke-width:2;rx:10}.risk{fill:#7f1d1d;stroke:#f87171;stroke-width:2;rx:10}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}.mut{fill:#9a3412;stroke:#fb923c;stroke-width:2;rx:10}</style></defs>
  <rect class="bg" width="1600" height="1160"/><text class="t" x="55" y="55">R2 protocol paths</text><text class="s" x="55" y="82">One configured writer. Database and manifest objects are immutable by convention. head.json is mutable.</text>

  <rect class="lane" x="45" y="120" width="1510" height="285"/><text class="h" x="75" y="158">create</text>
  <rect class="step" x="90" y="205" width="190" height="85"/><text class="l" x="185" y="236" text-anchor="middle">Inputs</text><text class="s" x="185" y="260" text-anchor="middle">workspace, config</text><text class="s" x="185" y="280" text-anchor="middle">Clock, Random implicit</text>
  <rect class="step" x="340" y="205" width="210" height="85"/><text class="l" x="445" y="236" text-anchor="middle">SQLite snapshot</text><text class="s" x="445" y="260" text-anchor="middle">integrity + serialize</text><text class="s" x="445" y="280" text-anchor="middle">WAL-aware bytes</text>
  <rect class="gate" x="610" y="195" width="220" height="105"/><text class="l" x="720" y="228" text-anchor="middle">Read current head</text><text class="s" x="720" y="252" text-anchor="middle">project, writer, key</text><text class="s" x="720" y="274" text-anchor="middle">parent or null</text>
  <rect class="step" x="890" y="195" width="230" height="105"/><text class="l" x="1005" y="228" text-anchor="middle">Put generation</text><text class="s" x="1005" y="252" text-anchor="middle">database then manifest</text><text class="s" x="1005" y="274" text-anchor="middle">download and hash each</text>
  <rect class="gate" x="1180" y="195" width="170" height="105"/><text class="l" x="1265" y="228" text-anchor="middle">Head unchanged?</text><text class="s" x="1265" y="252" text-anchor="middle">no: stale error</text><text class="s" x="1265" y="274" text-anchor="middle">yes: continue</text>
  <rect class="mut" x="1400" y="205" width="120" height="85"/><text class="l" x="1460" y="236" text-anchor="middle">Publish</text><text class="s" x="1460" y="260" text-anchor="middle">head.json</text><text class="s" x="1460" y="280" text-anchor="middle">verify hash</text>
  <path class="edge" d="M280 247H340"/><path class="edge" d="M550 247H610"/><path class="edge" d="M830 247H890"/><path class="edge" d="M1120 247H1180"/><path class="edge" d="M1350 247H1400"/>
  <text class="s" x="90" y="355">Output: generation ID, digest, byte length, parent. Failure leaves unreferenced immutable objects.</text>

  <rect class="lane" x="45" y="435" width="1510" height="250"/><text class="h" x="75" y="473">list</text>
  <rect class="step" x="130" y="525" width="220" height="85"/><text class="l" x="240" y="556" text-anchor="middle">Validate limit</text><text class="s" x="240" y="580" text-anchor="middle">1 through 1000</text>
  <rect class="gate" x="450" y="515" width="220" height="105"/><text class="l" x="560" y="548" text-anchor="middle">Read head</text><text class="s" x="560" y="572" text-anchor="middle">absent returns []</text><text class="s" x="560" y="594" text-anchor="middle">identity failures stop</text>
  <rect class="step" x="770" y="515" width="260" height="105"/><text class="l" x="900" y="548" text-anchor="middle">Walk parent chain</text><text class="s" x="900" y="572" text-anchor="middle">manifest by generation</text><text class="s" x="900" y="594" text-anchor="middle">stop at null or limit</text>
  <rect class="gate" x="1130" y="515" width="270" height="105"/><text class="l" x="1265" y="548" text-anchor="middle">Cycle or missing object?</text><text class="s" x="1265" y="572" text-anchor="middle">yes: fail visibly</text><text class="s" x="1265" y="594" text-anchor="middle">no: return manifests</text>
  <path class="edge" d="M350 567H450"/><path class="edge" d="M670 567H770"/><path class="edge" d="M1030 567H1130"/>

  <rect class="lane" x="45" y="715" width="1510" height="385"/><text class="h" x="75" y="753">restore</text>
  <rect class="step" x="80" y="820" width="190" height="90"/><text class="l" x="175" y="850" text-anchor="middle">Choose generation</text><text class="s" x="175" y="874" text-anchor="middle">explicit or head</text><text class="s" x="175" y="894" text-anchor="middle">validate ID</text>
  <rect class="step" x="325" y="820" width="190" height="90"/><text class="l" x="420" y="850" text-anchor="middle">Fetch objects</text><text class="s" x="420" y="874" text-anchor="middle">manifest + SQLite</text>
  <rect class="gate" x="570" y="800" width="245" height="130"/><text class="l" x="692" y="833" text-anchor="middle">Verify bytes</text><text class="s" x="692" y="857" text-anchor="middle">size + SHA-256</text><text class="s" x="692" y="879" text-anchor="middle">integrity_check</text><text class="s" x="692" y="901" text-anchor="middle">migrations + tables</text>
  <rect class="risk" x="870" y="800" width="255" height="130"/><text class="l" x="997" y="833" text-anchor="middle">Exact app version gate</text><text class="s" x="997" y="857" text-anchor="middle">backup version must equal</text><text class="s" x="997" y="879" text-anchor="middle">running package version</text><text class="s" x="997" y="901" text-anchor="middle">breaks future restore</text>
  <rect class="gate" x="1180" y="800" width="200" height="130"/><text class="l" x="1280" y="833" text-anchor="middle">Output exists?</text><text class="s" x="1280" y="857" text-anchor="middle">absent: publish</text><text class="s" x="1280" y="879" text-anchor="middle">same: idempotent</text><text class="s" x="1280" y="901" text-anchor="middle">different: conflict</text>
  <rect class="step" x="1430" y="820" width="110" height="90"/><text class="l" x="1485" y="850" text-anchor="middle">Output</text><text class="s" x="1485" y="874" text-anchor="middle">separate</text><text class="s" x="1485" y="894" text-anchor="middle">SQLite file</text>
  <path class="edge" d="M270 865H325"/><path class="edge" d="M515 865H570"/><path class="edge" d="M815 865H870"/><path class="edge" d="M1125 865H1180"/><path class="edge" d="M1380 865H1430"/>
  <text class="s" x="80" y="1010">Good boundary: restore never replaces the live canonical database.</text><text class="s" x="80" y="1036">Missing capability: no freshness status, timer, or write-triggered backup.</text>
</svg>
