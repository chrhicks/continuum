<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
  <title id="title">Effect v4 adherence audit</title><desc id="desc">A green memory runtime follows Effect guidance while orange storage and backup paths remain synchronous and exception based.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.bg{fill:#0f172a}.t{fill:#f8fafc;font:700 30px system-ui}.h{fill:#f8fafc;font:700 19px system-ui}.s{fill:#cbd5e1;font:14px system-ui}.box{stroke-width:2;rx:13}.pass{fill:#065f46;stroke:#34d399}.partial{fill:#854d0e;stroke:#facc15}.fail{fill:#7f1d1d;stroke:#f87171}.neutral{fill:#1e293b;stroke:#64748b}.edge{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}.tag{font:700 13px system-ui;fill:#f8fafc}</style></defs>
  <rect class="bg" width="1450" height="900"/><text class="t" x="55" y="58">Effect v4 audit: one coherent island, two bypasses</text>
  <rect class="box pass" x="70" y="130" width="390" height="250"/><text class="h" x="265" y="170" text-anchor="middle">Memory runtime</text><text class="s" x="100" y="208">PASS  Context.Service owns SQLite authority</text><text class="s" x="100" y="238">PASS  Layer.effect owns acquire and release</text><text class="s" x="100" y="268">PASS  Effect.fn names repository operations</text><text class="s" x="100" y="298">PASS  Schema records and tagged errors</text><text class="s" x="100" y="328">PASS  Result and Deferred replace v3 APIs</text><text class="s" x="100" y="354">KEEP  repository factories are values, not services</text>
  <rect class="box partial" x="530" y="130" width="390" height="250"/><text class="h" x="725" y="170" text-anchor="middle">Configuration</text><text class="s" x="560" y="208">PASS  environment read through Effect Config</text><text class="s" x="560" y="238">PASS  ConfigProvider tests avoid env mutation</text><text class="s" x="560" y="268">GAP   file I/O is synchronous and untyped</text><text class="s" x="560" y="298">GAP   malformed YAML silently becomes defaults</text><text class="s" x="560" y="328">GAP   Redacted secret unwraps into plain string</text>
  <rect class="box fail" x="990" y="130" width="390" height="250"/><text class="h" x="1185" y="170" text-anchor="middle">Storage and R2</text><text class="s" x="1020" y="208">GAP   59 explicit throw branches</text><text class="s" x="1020" y="238">GAP   generic Error reaches UNKNOWN_ERROR</text><text class="s" x="1020" y="268">GAP   manual unknown dictionary parsing</text><text class="s" x="1020" y="298">GAP   Clock, Random, process env are ambient</text><text class="s" x="1020" y="328">GAP   spawnSync blocks instead of typed adapter</text>

  <rect class="box neutral" x="80" y="490" width="285" height="120"/><text class="h" x="222" y="530" text-anchor="middle">CLI or MCP boundary</text><text class="s" x="222" y="558" text-anchor="middle">parse and render</text><text class="s" x="222" y="582" text-anchor="middle">composition root</text>
  <rect class="box pass" x="450" y="490" width="285" height="120"/><text class="h" x="592" y="530" text-anchor="middle">Application effect</text><text class="s" x="592" y="558" text-anchor="middle">precise requirement and error</text><text class="s" x="592" y="582" text-anchor="middle">named Effect.fn</text>
  <rect class="box pass" x="820" y="490" width="250" height="120"/><text class="h" x="945" y="530" text-anchor="middle">Authority service</text><text class="s" x="945" y="558" text-anchor="middle">ObjectStore or DB runtime</text><text class="s" x="945" y="582" text-anchor="middle">Layer-selected adapter</text>
  <rect class="box neutral" x="1155" y="490" width="220" height="120"/><text class="h" x="1265" y="530" text-anchor="middle">Technology edge</text><text class="s" x="1265" y="558" text-anchor="middle">SQLite or Wrangler</text><text class="s" x="1265" y="582" text-anchor="middle">classified failures</text>
  <path class="edge" d="M365 550H450"/><path class="edge" d="M735 550H820"/><path class="edge" d="M1070 550H1155"/>
  <text class="h" x="80" y="685">Smallest convergence target</text><text class="s" x="80" y="720">Keep pure key generation and manifest construction as ordinary functions.</text><text class="s" x="80" y="748">Make backup orchestration an Effect operation with a narrow ObjectStore authority service.</text><text class="s" x="80" y="776">Parse receipt, config, head, and manifest with Effect Schema at their boundaries.</text><text class="s" x="80" y="804">Map storage, process, R2, checksum, lineage, and restore conflicts to precise tagged errors.</text>
</svg>
