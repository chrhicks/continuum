<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
  <title id="title">Master to branch review metrics</title><desc id="desc">Charts compare tests, coverage, anti-slop findings, duplication, and changed lines by area.</desc>
  <style>.bg{fill:#0f172a}.t{fill:#f8fafc;font:700 30px system-ui}.h{fill:#f8fafc;font:700 18px system-ui}.s{fill:#cbd5e1;font:13px system-ui}.axis{stroke:#475569;stroke-width:1}.master{fill:#64748b}.branch{fill:#38bdf8}.bad{fill:#fb7185}.good{fill:#34d399}.panel{fill:#111827;stroke:#334155;stroke-width:2;rx:13}.n{fill:#f8fafc;font:700 20px system-ui}</style>
  <rect class="bg" width="1450" height="900"/><text class="t" x="55" y="58">Master to branch metrics</text>
  <rect class="panel" x="55" y="105" width="420" height="300"/><text class="h" x="80" y="140">Tests and line coverage</text>
  <text class="s" x="90" y="195">tests</text><rect class="master" x="180" y="170" width="194" height="28"/><rect class="branch" x="180" y="210" width="210" height="28"/><text class="s" x="382" y="190">97</text><text class="s" x="398" y="230">105</text>
  <text class="s" x="90" y="290">line %</text><rect class="master" x="180" y="265" width="195" height="28"/><rect class="branch" x="180" y="305" width="195.4" height="28"/><text class="s" x="383" y="285">65.10</text><text class="s" x="383" y="325">65.14</text>
  <rect class="master" x="82" y="355" width="18" height="18"/><text class="s" x="108" y="369">master</text><rect class="branch" x="180" y="355" width="18" height="18"/><text class="s" x="206" y="369">branch</text>

  <rect class="panel" x="515" y="105" width="420" height="300"/><text class="h" x="540" y="140">Anti-slop diagnostics</text>
  <text class="n" x="555" y="210">298</text><text class="s" x="555" y="235">master</text><text class="n" x="730" y="210">322</text><text class="s" x="730" y="235">branch</text><text class="n" x="855" y="210" fill="#fb7185">+24</text>
  <rect class="bad" x="555" y="275" width="225" height="22"/><text class="s" x="790" y="291">+15 unsafe dictionaries</text>
  <rect class="bad" x="555" y="307" width="60" height="22"/><text class="s" x="625" y="323">+4 unknown inputs</text>
  <rect class="bad" x="555" y="339" width="60" height="22"/><text class="s" x="625" y="355">+4 runtime typeof</text>
  <text class="s" x="555" y="386">Most net new findings come from backup/contracts.ts.</text>

  <rect class="panel" x="975" y="105" width="420" height="300"/><text class="h" x="1000" y="140">Duplication and cycles</text>
  <text class="n" x="1010" y="210">10</text><text class="s" x="1010" y="235">exact clones, unchanged</text><text class="n" x="1010" y="290">73</text><text class="s" x="1010" y="315">duplicated lines, unchanged</text><text class="n" x="1240" y="210">1</text><text class="s" x="1240" y="235">cycle, pre-existing</text><text class="s" x="1010" y="365">Duplication rate fell from 0.48% to 0.44%</text><text class="s" x="1010" y="386">only because the codebase grew.</text>

  <rect class="panel" x="55" y="450" width="1340" height="380"/><text class="h" x="80" y="488">Changed lines by area</text>
  <line class="axis" x1="225" y1="525" x2="225" y2="790"/>
  <text class="s" x="80" y="555">backup</text><rect class="branch" x="225" y="535" width="530" height="25"/><text class="s" x="765" y="553">+884 / -0</text>
  <text class="s" x="80" y="600">storage</text><rect class="branch" x="225" y="580" width="337" height="25"/><rect class="bad" x="562" y="580" width="2" height="25"/><text class="s" x="575" y="598">+561 / -2</text>
  <text class="s" x="80" y="645">tests</text><rect class="branch" x="225" y="625" width="379" height="25"/><rect class="bad" x="604" y="625" width="61" height="25"/><text class="s" x="675" y="643">+632 / -101</text>
  <text class="s" x="80" y="690">Effect memory</text><rect class="branch" x="225" y="670" width="220" height="25"/><rect class="bad" x="445" y="670" width="254" height="25"/><text class="s" x="710" y="688">+367 / -424</text>
  <text class="s" x="80" y="735">integration</text><rect class="branch" x="225" y="715" width="133" height="25"/><rect class="bad" x="358" y="715" width="30" height="25"/><text class="s" x="398" y="733">+222 / -50</text>
  <text class="s" x="80" y="780">docs/config</text><rect class="branch" x="225" y="760" width="85" height="25"/><rect class="bad" x="310" y="760" width="7" height="25"/><text class="s" x="327" y="778">+142 / -11</text>
  <text class="s" x="900" y="555">Total</text><text class="n" x="1000" y="555">64 files</text><text class="n" x="1000" y="600">+2,808</text><text class="n" x="1000" y="645" fill="#fb7185">-588</text><text class="s" x="900" y="700">Review inventory</text><text class="s" x="1000" y="700">252 functions</text><text class="s" x="1000" y="728">503 syntactic decisions</text><text class="s" x="1000" y="756">99 explicit throws</text>
</svg>
